# cargo-deny configuration — GooseClaw supply-chain gate (layer: licenses + advisories + sources).
# The Meta/OpenAI/xAI VENDOR exclusion is layer 1: scripts/vendor_gate.py (CI job vendor-gate).
# cargo-deny does NOT re-implement vendor policy; it guards licenses, advisories, and sources.
# Pin: cargo-deny 0.20.2 (2026-07-09, EmbarkStudios/cargo-deny releases) — as-of 2026-10-27.

[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# AGPL-3.0-or-later is OUR license; dependencies must be compatible (one-way compose).
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
