# GooseClaw workspace — Nostr-native, always-on fiduciary agent runtime.
# License: AGPL-3.0-or-later. See LICENSE.
# Governance: CLAUDE.md (Tier 1 hard rules), RECIPE.md (dependency graph), specification.md (canon).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MartinMontero/GooseClaw"
rust-version = "1.85"

[workspace.dependencies]
# Intra-workspace
gooseclaw = { path = "crates/gooseclaw", version = "0.1.0" }
gooseclaw-safety = { path = "crates/gooseclaw-safety", version = "0.1.0" }

# ACP client: pinned to match the installed goose 1.48.0 (its Cargo.lock @ v1.48.0
# pins agent-client-protocol 2.0.0). Wire protocol: protocolVersion = 1 (ProtocolVersion::V1).
# Spec's 1.0.0 pin is SUPERSEDED — drift recorded in docs/audit/2026-10-27-phase0-verify/.
agent-client-protocol = "=2.0.0"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
anyhow = "1"

[profile.release]
# No debug info in release binaries: local-first, no accidental leakage.
debug = false
